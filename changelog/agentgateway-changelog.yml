description: >-
  Agentgateway publishes a dated release history in two places: GitHub Releases (every tag, including
  prereleases) and a curated per-minor release-notes page in the docs that is organised into
  Highlights / Breaking changes / Removed or deprecated / New features / Fixes, each breaking item
  carrying an explicit "Actions to take" paragraph. Only the recent window is captured here.
