  current_version: v1.5.0
  current_version_date: '2026-08-27'
  feed: null
  feed_note: No RSS/Atom feed for the changelog itself. The project blog does publish https://agentgateway.dev/blog/index.xml and announces each minor there.
entries:
  - version: v1.5.0
    date: '2026-08-27'
    breaking: true
    highlights:
      - API key budgets and model access - cap an individual API key's LLM spend in dollars or tokens and limit which models it can reach.
      - Native Gemini inbound API - Gemini and Vertex AI SDK clients can call agentgateway in Gemini's native wire format.
      - Anthropic Messages to OpenAI Responses conversion.
      - Egress proxying, TCP backends and CONNECT tunneling.
      - Rebuilt logs and trajectory views in the admin UI for multi-turn agent activity and tool calls.
    breaking_changes:
      - LLM input and total token counts now include cache tokens; llm.providerInputTokens / llm.providerTotalTokens added for the raw provider value. Escape hatch AGENTGATEWAY_LEGACY_LLM_USAGE_TOKEN_SEMANTICS=true, planned for removal after 1.5.
      - JWT validation now REQUIRES the iss claim when issuer is set, and aud when audiences is a non-empty list. Tokens that omitted the claim used to pass.
      - An AI policy on a backend now merges field-by-field with an attached AI policy instead of replacing it wholesale.
      - A listener that cannot bind now fails startup with a non-zero exit instead of logging a warning.
      - Managed API key metadata moved to the reserved agentgateway.dev/ prefix - metadata.id is now metadata["agentgateway.dev/id"].
    removed_or_deprecated:
      - MODEL_CATALOG_PATHS environment variable removed; use config.modelCatalog. Silently ignored after upgrade.
      - '`agctl costs` renamed to `agctl catalog`.'
    source: https://agentgateway.dev/docs/standalone/latest/reference/release-notes/
