identifiers:
  scheme: names, not opaque ids
  detail: >-
    Entities are addressed by `name` (and `namespace` where the Kubernetes model applies), not by a
    generated id with a type prefix. The one id-like surface is LLM API key metadata, where
    agentgateway manages metadata["agentgateway.dev/id"] and metadata["agentgateway.dev/createdAt"]
    under a reserved prefix that user metadata may not use (1.5.0 onward).
configuration_modes:
  note: >-
    The schema deliberately carries two spellings of the same model. The `binds`/`listeners`/`routes`
    tree is the full routing form; `gateways`, `llm` and `mcp` are simplified forms that expand into
    it. Docs show both in tabbed examples. A reader mapping this graph should expect the same concept
    to appear twice under different names.
  docs: https://agentgateway.dev/docs/standalone/latest/llm/configuration-modes/
