openapi: 3.1.0
info:
  title: AgentGateway Admin / Debug Config API
  version: 1.0.0
  description: AgentGateway exposes a local admin and debug HTTP API on its administrative bind address (default 127.0.0.1:15000) for inspecting runtime configuration, controlling logging, profiling, and triggering graceful shutdown. AgentGateway also forwards LLM, MCP and A2A traffic to upstream providers via dynamic routes, but those routes are user-configured rather than fixed paths.
  contact:
    name: AgentGateway
    url: https://agentgateway.dev/docs/
servers:
- url: http://127.0.0.1:15000
  description: Default admin / debug bind address (configurable via adminAddr)
tags:
- name: Config
paths:
  /config_dump:
    get:
      tags:
      - Config
      summary: Dump the runtime configuration
      responses:
        '200':
          description: Current runtime configuration
