description: >-
  Agentgateway publishes NO plans and NO pricing. It is an Apache-2.0 open-source project of LF
  Projects, LLC (contributed by Solo.io in August 2025, now an Agentic AI Foundation project) that you
  download and run yourself. There is no hosted service, no account, no signup, no metered quota and
  no price list. A /pricing path was probed on 2026-08-30 and returned 404; the site has no pricing
  page and no pricing entry in its navigation.
  THIS FILE REPLACES A SCAFFOLD. The previous version, written by a bulk sweep dated 2026-05-04,
  invented Free / Professional / Enterprise tiers with a 1,000-request monthly quota and a
  10-requests-per-minute limit. None of that was ever published by agentgateway. It has been removed.
