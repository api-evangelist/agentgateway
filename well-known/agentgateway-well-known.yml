method: probed
source: live HTTP probes of https://agentgateway.dev/.well-known/*
description: >-
  Well-known document probe for the agentgateway host. Every path returned HTTP 404 with the site's
  Next.js 404 page. No /.well-known document is served, so NO WellKnown or SecurityTxt pointer is
  emitted in apis.yml - this file records a verified absence, not a presence. Note that agentgateway
  itself GENERATES /.well-known/oauth-protected-resource and /.well-known/oauth-authorization-server
  responses for the MCP servers it fronts (see conformance/agentgateway-conformance.yml); those are
  served by a user's own deployment, never by agentgateway.dev.
